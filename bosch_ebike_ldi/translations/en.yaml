configuration:
  bridge_name:
    name: Accessory name
    description: The name the bike and the Flow app show for this app.
  adapter:
    name: Bluetooth adapter
    description: Adapter to use, e.g. hci0, or "auto" for the first one found.
  private_advertising:
    name: Private advertising
    description: >-
      Only show the bridge to Flow apps during the 5-minute pairing window
      (after pressing "Start pairing"). Paired bikes still reconnect at any
      time.
  log_level:
    name: Log level
    description: Use debug to log every raw data packet from the bike.
  battery_wh:
    name: Battery size (Wh)
    description: >-
      Nominal energy of the bike's battery, used only for the "Estimated
      Remaining Energy" sensor. PowerTube 800 = 800. A bike listed under
      Bikes can set its own battery_wh.
  bikes:
    name: Bikes
    description: >-
      Optional. Bikes are added with the "Pair selected bike" or "Start
      pairing" buttons; list one here (by Bluetooth address) only to give it a
      name or its own battery_wh.
  mcsp:
    name: MCSP exploration
    description: Read the Flow app's channel (read-only) when the bike exposes it.
  mcsp_connect:
    name: Automatic full readings
    description: >-
      When your bike advertises, connect for a few seconds: read everything
      (battery health, cycles, motor hours ...) if it's charging, let go at
      once otherwise so the Flow app gets it. At most once per 10 minutes.
  mcsp_sweep:
    name: Datapoint sweep
    description: Read every readable datapoint once per drive-unit firmware.
  mcsp_reconnect_hours:
    name: Hours before reconnecting (unused)
    description: Not used since 0.6.
  gatt_listen:
    name: Listen to all characteristics
    description: Record every other notifying Bluetooth characteristic.
  raw_entities:
    name: Per-datapoint entities
    description: One hidden diagnostic entity per decoded datapoint.
  capture:
    name: Debug capture
    description: Write the debug capture and report to /share/bosch_ebike.
  open_pairing_on_start:
    name: Open pairing window on start
    description: Open the 5-minute pairing window every time the app starts.
  accessory_manufacturer:
    name: Accessory manufacturer
    description: Served to the bike; the Flow app doesn't show it.
  accessory_model:
    name: Accessory part number
    description: Shown as "Part number" for this accessory in the Flow app.
  accessory_hardware:
    name: Accessory hardware revision
    description: Served to the bike; the Flow app doesn't show it.
  accessory_serial:
    name: Accessory serial number
    description: Leave empty for "HA-" plus the end of the Pi's Bluetooth address.
  notify_full:
    name: Notify when fully charged
    description: >-
      A Home Assistant notification once per charge when the battery reaches
      100 % with the charger connected.
  firmware_check:
    name: Firmware check
    description: >-
      Compare the bike's firmware with Bosch's published versions daily and
      show update entities. Information only; never installs anything.
  firmware_page:
    name: Firmware page
    description: Bosch's software-update page for your country.
  mqtt_host:
    name: MQTT host
    description: Leave empty to use the Mosquitto broker add-on.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT username
  mqtt_password:
    name: MQTT password
