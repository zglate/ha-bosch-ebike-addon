name: Bosch eBike
version: "0.7.1"
slug: bosch_ebike_ldi
description: >-
  VERY EARLY TEST BUILD, don't use yet. Live data and diagnostics from a
  Bosch smart system eBike over the Home Assistant host's Bluetooth: the
  official Live Data Interface plus a read-only exploration of the Flow app's
  channel (MCSP), with full debug capture.
url: https://github.com/zglate/ha-bosch-ebike-addon
stage: experimental
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_dbus: true
homeassistant_api: true     # to show setup notifications in Home Assistant
ingress: true               # "Open web UI": download debug captures
ingress_port: 8099
panel_icon: mdi:bicycle-electric
services:
  - mqtt:want
map:
  - type: share
    read_only: false
options:
  bridge_name: HA eBike Bridge
  adapter: hci0
  private_advertising: true
  log_level: info
  battery_wh: 800
  bikes: []
  mcsp: true
  mcsp_connect: true
  mcsp_sweep: true
  gatt_listen: true
  raw_entities: true
  capture: true
  open_pairing_on_start: false
  mcsp_reconnect_hours: 6
  firmware_check: true
  firmware_page: https://www.bosch-ebike.com/ca/service/software-update
schema:
  bridge_name: str
  adapter: str
  private_advertising: bool
  log_level: list(debug|info|warning|error)
  battery_wh: int(100,5000)
  bikes:
    - address: match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)
      name: str?
      battery_wh: int(100,5000)?
  mcsp: bool
  mcsp_connect: bool
  mcsp_sweep: bool
  gatt_listen: bool
  raw_entities: bool
  capture: bool
  open_pairing_on_start: bool
  mcsp_reconnect_hours: float(0,168)
  firmware_check: bool
  firmware_page: url
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
