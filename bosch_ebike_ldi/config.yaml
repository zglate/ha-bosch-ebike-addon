name: Bosch eBike
version: "0.8.3"
slug: bosch_ebike_ldi
description: >-
  Early version. Battery health, charging, rides, range, messages and live
  data from a Bosch smart system eBike, over the Home Assistant host's
  Bluetooth, on one page. Read-only: never changes anything on the bike.
url: https://github.com/zglate/ha-bosch-ebike-addon
stage: experimental
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_dbus: true
homeassistant_api: true     # to show setup notifications in Home Assistant
ingress: true               # "Open web UI": the add-on's page
ingress_port: 8099
panel_icon: mdi:bicycle-electric
services:
  - mqtt:want
map:
  - type: share
    read_only: false
options:
  bridge_name: Home Assistant Reader
  adapter: hci0
  private_advertising: true
  log_level: info
  battery_wh: 800
  bikes: []
  mcsp: true
  mcsp_connect: true
  mcsp_sweep: true
  gatt_listen: true
  raw_entities: false
  capture: true
  open_pairing_on_start: false
  mcsp_reconnect_hours: 6
  firmware_check: true
  notify_full: true
  accessory_manufacturer: Home Assistant
  accessory_model: BHA2026
  accessory_hardware: HA-4200-PI
  accessory_serial: ""
  firmware_page: https://www.bosch-ebike.com/ca/service/software-update
schema:
  bridge_name: str
  adapter: str
  private_advertising: bool
  log_level: list(debug|info|warning|error)
  battery_wh: int(100,5000)
  bikes:
    - address: match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)
      name: str?
      battery_wh: int(100,5000)?
  mcsp: bool
  mcsp_connect: bool
  mcsp_sweep: bool
  gatt_listen: bool
  raw_entities: bool
  capture: bool
  open_pairing_on_start: bool
  mcsp_reconnect_hours: float(0,168)
  firmware_check: bool
  notify_full: bool
  accessory_manufacturer: str
  accessory_model: str
  accessory_hardware: str
  accessory_serial: str?
  firmware_page: url
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
